<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSY | Analisador de Performance Semanal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <h1>MSY ANALYTICS</h1>
    <div class="subtitle">Sistema de Performance Semanal</div>
    
    <div class="controls">
        <div class="control-group">
            <label>Arquivo do Chat</label>
            <input type="file" id="arquivoInput" accept=".txt">
        </div>
        
        <div class="control-group">
            <label>Período de Análise</label>
            <div class="date-inputs">
                <label>Início <input type="date" id="dataInicio" value="2026-01-01"></label>
                <label>Fim <input type="date" id="dataFim" value="2026-01-05"></label>
            </div>
        </div>
        
        <div class="control-group">
            <label style="opacity: 0;">Ação</label>
            <button onclick="enviarParaAnalise()">🚀 Iniciar Análise</button>
        </div>
    </div>

    <div id="filtros-area">
        <span>Filtros:</span>
        <input type="text" id="searchBar" placeholder="Buscar membro..." onkeyup="filtrarPorTexto()">
        <div class="chips-container" id="listaMembros"></div>
    </div>

    <div id="loadingAnalise" class="loading">⏳ Processando dados</div>
    <div id="resultado"></div>

    <div id="area-ia">
        <h2>🤖 Relatório Inteligente</h2>
        <div class="ia-box">
            <label>Instrução Personalizada (Opcional):</label>
            <textarea id="promptIA" placeholder="Ex: Seja sarcástico e faça piada com quem falou pouco. Dê um prêmio fictício para o top 1."></textarea>
            <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
                <button onclick="gerarRelatorioIA()">✨ Gerar Relatório com IA</button>
                <button onclick="gerarRelatorioBase()">📄 Gerar Relatório Base</button>
            </div>
            
            <div id="loadingIA" class="loading">🧠 IA processando análise</div>
            <div id="relatorio-final"></div>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
